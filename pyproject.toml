[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envr-footprint-healthcare"
version = "0.1.0"
description = "Environmental footprint analysis of healthcare supply chains"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["paths"]

[tool.setuptools.packages.find]
where = ["src"]
